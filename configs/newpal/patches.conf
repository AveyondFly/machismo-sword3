# NewPAL version SHA-256: f7df6df91783bcb19abbd6be365651cbf1878982d8d280509f5784b6fa331b8e

# The title selects m001_song and m001 with equal probability by drawing from
# Random(2), then choosing the vocal track only when the result is 1. Draw from
# five values and send the single value 1 to the instrumental branch, leaving
# the other four values on the vocal branch (80% vocal, 20% instrumental).
# mov w0, #2 -> mov w0, #5
at 0x10000948c 0x528000a0 ; expect 0x52800040
# b.ne 0x1000094b0 -> b.eq 0x1000094b0
at 0x100009498 0x540000c0 ; expect 0x540000c1

# Field movement (0x100072e58) picks run or walk from bit 0x10 of the
# direction flags. Keyboard directions only set it on a double tap and the
# controller axis only on a gradual push past 30000, so a D-pad walks.
# Force the bit so every field step uses the run speed and animation.
# and w10, w10, #0x10 -> mov w10, #0x10
at 0x100073a70 0x5280020a ; expect 0x121c014a
