# The title selects m001_song and m001 with equal probability by drawing from
# Random(2), then choosing the vocal track only when the result is 1. Draw from
# five values and send the single value 1 to the instrumental branch, leaving
# the other four values on the vocal branch (80% vocal, 20% instrumental).
# mov w0, #2 -> mov w0, #5
at 0x10000948c 0x528000a0 ; expect 0x52800040
# b.ne 0x1000094b0 -> b.eq 0x1000094b0
at 0x100009498 0x540000c0 ; expect 0x540000c1
