# Pal2 AppStore (SHA-256 f9e510328d0c22eec61da1f0ebe501fa56454e4972e5149277cc3abe7ce8d2a3)
# MenuLoop.an2 title (event 0x63) wraps keyboard focus through 1, 2, and 3.
# Only ids 1 and 2 have buttons (新的冒险 / 旧的回忆); 3 draws no highlight.

# cmp w8, #4 -> cmp w8, #3  so focus >= 3 wraps to 1
at 0x100048f38 0x71000d1f ; expect 0x7100111f
# mov w9, #3 -> mov w9, #2  so focus <= 0 wraps to 2
at 0x100048f58 0x52800049 ; expect 0x52800069

# Target selection queries action 6 twice. The first query consumes the
# keyboard release, so branch directly to the existing selected-node confirm
# body instead of asking for the same release again.
# cbz w0, 0x100064d4c -> cbnz w0, 0x100064894
at 0x100064700 0x35000ca0 ; expect 0x34003260

# The shared item/spirit selector only uses keyboard action 6 to play its
# disabled-entry sound. Actual selection is gated by a mouse hit index in w28.
# Preserve the existing validity checks, but keep the keyboard highlight in w28
# and join the mouse commit path when the highlighted entry is enabled. Disabled
# entries still use the original 0x11e feedback-sound path.
# ldr w8, [x19, #0xbec] -> ldr w28, [x19, #0xbec]
at 0x10005458c 0xb94bee7c ; expect 0xb94bee68
# tbnz w8, #31, 0x1000545b4 -> tbnz w28, #31, 0x1000545b4
at 0x100054590 0x37f8013c ; expect 0x37f80128
# madd x8, x8, x10, x9 -> madd x8, x28, x10, x9
at 0x1000545a0 0x9b0a2788 ; expect 0x9b0a2508
# cbnz w8, 0x1000545b4 -> cbnz w8, 0x100054974
at 0x1000545a8 0x35001e68 ; expect 0x35000068

# The field-menu character selector treats every non-zero direction result as
# movement. Keyboard press returns 1 and release returns -1, so a single
# left/right tap advances twice and wraps back when the party has two members.
# Accept only the one-shot release result while preserving the original
# touch-mode and enabled-state guards.
# cmp w0, #0 -> cmn w0, #1
at 0x1000557e0 0x3100041f ; expect 0x7100001f
# ccmp w8, #3, #4, ne -> ccmp w8, #3, #4, eq
at 0x1000557e4 0x7a430904 ; expect 0x7a431904

# cbz w0, 0x100055840 -> tbz w0, #31, 0x100055840
at 0x100055814 0x36f80160 ; expect 0x34000160

# Item/spirit effect target selection has the same press-and-release double
# movement bug in a separate character-selector loop. Keep the final shared
# normalization/store and only advance on the one-shot release result.
at 0x100053700 0x3100041f ; expect 0x7100001f
at 0x100053704 0x7a430904 ; expect 0x7a431904
# cbz w0, 0x100053744 -> tbz w0, #31, 0x100053744
at 0x10005372c 0x36f800c0 ; expect 0x340000c0

# The equipment screen uses a third character-selection loop with the same
# non-zero test. Only let the one-shot release value (-1) reach its wrap logic.
at 0x10005b9a0 0x36f80180 ; expect 0x34000180
at 0x10005b9ec 0x36f800c0 ; expect 0x340000c0
